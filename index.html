<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Live Preis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .price { font-size: 4.5rem; font-weight: 700; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center">
  <div class="max-w-md mx-auto text-center p-8">
    <div class="flex items-center justify-center gap-3 mb-8">
      <i class="fa-brands fa-bitcoin text-yellow-500 text-5xl"></i>
      <h1 class="text-4xl font-bold">Bitcoin Preis</h1>
    </div>
    
    <div id="price-container" class="mb-8">
      <div id="price" class="price text-emerald-400">—</div>
      <div id="change" class="text-xl font-medium mt-2 flex items-center justify-center gap-2"></div>
    </div>
    
    <div class="text-zinc-400 text-sm">
      Letzte Aktualisierung: <span id="last-update" class="font-mono"></span>
    </div>
    
    <button onclick="fetchPrice()" 
            class="mt-8 px-6 py-3 bg-white text-black rounded-2xl font-medium hover:bg-amber-400 transition-colors">
      <i class="fa-solid fa-rotate"></i> Jetzt aktualisieren
    </button>
    
    <p class="text-xs text-zinc-500 mt-12">Daten von CoinGecko • Aktualisiert alle 10 Sekunden</p>
  </div>

  <script>
    async function fetchPrice() {
      const priceEl = document.getElementById('price');
      const changeEl = document.getElementById('change');
      const updateEl = document.getElementById('last-update');
      
      priceEl.textContent = 'Laden...';
      
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true');
        const data = await res.json();
        
        const price = data.bitcoin.eur.toLocaleString('de-DE');
        const change24h = data.bitcoin.eur_24h_change;
        
        priceEl.textContent = price + ' €';
        
        const changeText = change24h.toFixed(2) + '%';
        changeEl.innerHTML = `
          <span class="${change24h >= 0 ? 'text-emerald-400' : 'text-red-400'}">
            ${change24h >= 0 ? '↑' : '↓'} ${changeText}
          </span>
          <span class="text-zinc-400 text-sm ml-2">24h</span>
        `;
        
        const now = new Date();
        updateEl.textContent = now.toLocaleTimeString('de-DE');
        
      } catch (error) {
        priceEl.textContent = 'Fehler';
        console.error(error);
      }
    }

    // Automatisch alle 10 Sekunden aktualisieren
    setInterval(fetchPrice, 10000);
    
    // Beim Laden der Seite sofort abrufen
    window.onload = fetchPrice;
  </script>
</body>
</html>
