<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitaluhr - Aktuelle Uhrzeit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .clock-time { font-family: 'Space Grotesk', sans-serif; font-size: 7rem; font-weight: 700; letter-spacing: -4px; }
    .date { font-size: 1.5rem; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center">
  <div class="text-center px-6">
    <div class="flex items-center justify-center gap-3 mb-8">
      <i class="fa-solid fa-clock text-5xl text-blue-400"></i>
      <h1 class="text-4xl font-semibold tracking-tight">Aktuelle Uhrzeit</h1>
    </div>
    
    <div id="time" class="clock-time text-white mb-2">00:00:00</div>
    
    <div id="date" class="date text-zinc-400 font-medium"></div>
    
    <div class="mt-12 text-zinc-500 text-sm flex items-center justify-center gap-2">
      <i class="fa-solid fa-globe"></i>
      <span>Deutschland • CEST</span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      // Zeit formatieren (24h)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
      
      // Datum formatieren
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('de-DE', dateOptions);
      document.getElementById('date').textContent = dateStr;
    }

    // Alle 1000ms aktualisieren
    setInterval(updateClock, 1000);
    
    // Sofort beim Laden aktualisieren
    window.onload = updateClock;
  </script>
</body>
</html>
